name: Deploy QA

on:
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: "Confirm controlled deployment to QA"
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-qa
  cancel-in-progress: false

env:
  AWS_REGION: us-east-2
  ECR_REPOSITORY: afiliaciones-qa-app
  QA_INSTANCE_ID: i-095d15242588ec268
  QA_BASE_URL: https://afiliaciones-qa.iimp.org.pe

jobs:
  quality-gates:
    name: Quality gates
    if: inputs.confirm_deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout requested revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.11.4

      - name: Check Terraform formatting
        working-directory: infra/terraform
        run: terraform fmt -check -recursive

      - name: Initialize Terraform without backend
        working-directory: infra/terraform/environments/qa
        run: terraform init -backend=false -input=false

      - name: Validate Terraform configuration
        working-directory: infra/terraform/environments/qa
        run: terraform validate

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Scan for committed secrets
        run: npm run security:secrets

      - name: Check runtime dependencies
        run: npm run security:runtime

      - name: Typecheck, lint and test
        run: npm run check

      - name: Verify /consulta initial UI in a real browser
        run: node modules/afiliaciones/consulta/Tests/ConsultaInitialState.browser.mjs

      - name: Build application
        run: npm run build

  build-and-deploy:
    name: Build, publish and deploy QA
    needs: quality-gates
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: qa
    steps:
      - name: Validate external deployment configuration
        env:
          AWS_ROLE_ARN: ${{ vars.QA_DEPLOY_ROLE_ARN }}
        run: |
          test -n "$AWS_ROLE_ARN" || {
            echo "Repository/environment variable QA_DEPLOY_ROLE_ARN is required."
            exit 1
          }

      - name: Checkout requested revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.QA_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: afiliaciones-qa-${{ github.run_id }}

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve immutable image reference
        id: image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          image_tag="qa-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          image_uri="${ECR_REGISTRY}/${ECR_REPOSITORY}:${image_tag}"
          echo "tag=${image_tag}" >> "$GITHUB_OUTPUT"
          echo "uri=${image_uri}" >> "$GITHUB_OUTPUT"

      - name: Build and push immutable QA image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.uri }}
          build-args: |
            NEXT_PUBLIC_APP_URL=${{ env.QA_BASE_URL }}
          cache-from: type=gha,scope=qa-web-image
          cache-to: type=gha,mode=max,scope=qa-web-image
          provenance: false

      - name: Verify image is available in ECR
        env:
          EXPECTED_DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: |
          actual_digest="$(aws ecr describe-images \
            --region "$AWS_REGION" \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids "imageTag=$IMAGE_TAG" \
            --query 'imageDetails[0].imageDigest' \
            --output text)"
          test "$actual_digest" = "$EXPECTED_DIGEST"

      - name: Deploy only the app service through SSM
        env:
          IMAGE_URI: ${{ steps.image.outputs.uri }}
        shell: bash
        run: |
          jq -n --arg image_uri "$IMAGE_URI" \
            '{ImageUri: [$image_uri]}' > ssm-parameters.json

          command_id="$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "$QA_INSTANCE_ID" \
            --document-name AfiliacionesQaDeploy \
            --comment "Deploy immutable QA app image from GitHub Actions" \
            --parameters file://ssm-parameters.json \
            --query 'Command.CommandId' \
            --output text)"

          for attempt in $(seq 1 180); do
            status="$(aws ssm get-command-invocation \
              --region "$AWS_REGION" \
              --command-id "$command_id" \
              --instance-id "$QA_INSTANCE_ID" \
              --query 'Status' \
              --output text 2>/dev/null || true)"
            case "$status" in
              Success)
                aws ssm get-command-invocation \
                  --region "$AWS_REGION" \
                  --command-id "$command_id" \
                  --instance-id "$QA_INSTANCE_ID" \
                  --query 'StandardOutputContent' \
                  --output text
                exit 0
                ;;
              Failed|Cancelled|TimedOut|Cancelling)
                aws ssm get-command-invocation \
                  --region "$AWS_REGION" \
                  --command-id "$command_id" \
                  --instance-id "$QA_INSTANCE_ID" \
                  --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
                  --output json
                exit 1
                ;;
            esac
            sleep 5
          done

          echo "SSM deployment did not reach a terminal state within 15 minutes."
          exit 1
